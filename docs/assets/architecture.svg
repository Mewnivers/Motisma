<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Architecture du bot Motisma'Pau</title>
  <desc id="d">Discord communique avec le bot, qui lit et écrit dans PostgreSQL. En option, le bot envoie des captures de profil à l'API Gemini.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="16" fill="#0f172a"/>

  <rect x="30" y="100" width="170" height="100" rx="12" fill="#5865f2"/>
  <text x="115" y="140" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Discord</text>
  <text x="115" y="164" font-size="13" fill="#e0e7ff" text-anchor="middle">Commandes, rôles,</text>
  <text x="115" y="182" font-size="13" fill="#e0e7ff" text-anchor="middle">salons</text>

  <rect x="320" y="90" width="200" height="120" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="420" y="124" font-size="18" fill="#f1f5f9" text-anchor="middle" font-weight="700">Bot Motisma</text>
  <text x="420" y="148" font-size="12" fill="#cbd5e1" text-anchor="middle">Node.js · discord.js 14</text>
  <text x="420" y="168" font-size="12" fill="#94a3b8" text-anchor="middle">commands/ · features/</text>
  <text x="420" y="186" font-size="12" fill="#94a3b8" text-anchor="middle">/rdv, classement, niveaux…</text>

  <rect x="660" y="105" width="210" height="90" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="765" y="140" font-size="17" fill="#f1f5f9" text-anchor="middle" font-weight="700">API Gemini</text>
  <text x="765" y="164" font-size="12" fill="#cbd5e1" text-anchor="middle">Lecture des captures de profil</text>
  <text x="765" y="182" font-size="12" fill="#fbbf24" text-anchor="middle">facultatif (clé requise)</text>

  <rect x="320" y="240" width="200" height="50" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="420" y="272" font-size="18" fill="#f1f5f9" text-anchor="middle" font-weight="700">PostgreSQL</text>

  <line x1="204" y1="150" x2="316" y2="150" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="420" y1="214" x2="420" y2="236" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="524" y1="150" x2="656" y2="150" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
</svg>
