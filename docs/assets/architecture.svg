<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Architecture du bot Motisma'Pau</title>
  <desc id="d">Discord communique avec le bot, qui lit et écrit dans PostgreSQL. En option, le bot envoie des captures de profil à l'API Gemini. Le site et l'API, dans le dépôt séparé PoGo-Pau, utilisent la même base.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="16" fill="#0f172a"/>

  <!-- Discord -->
  <rect x="30" y="120" width="170" height="100" rx="12" fill="#5865f2"/>
  <text x="115" y="160" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Discord</text>
  <text x="115" y="184" font-size="13" fill="#e0e7ff" text-anchor="middle">Commandes, rôles,</text>
  <text x="115" y="202" font-size="13" fill="#e0e7ff" text-anchor="middle">salons</text>

  <!-- Bot -->
  <rect x="320" y="110" width="200" height="120" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="420" y="144" font-size="18" fill="#f1f5f9" text-anchor="middle" font-weight="700">Bot Motisma</text>
  <text x="420" y="168" font-size="12" fill="#cbd5e1" text-anchor="middle">Node.js · discord.js 14</text>
  <text x="420" y="188" font-size="12" fill="#94a3b8" text-anchor="middle">commands/ · features/</text>
  <text x="420" y="206" font-size="12" fill="#94a3b8" text-anchor="middle">/rdv, /map, classement, niveaux…</text>

  <!-- PostgreSQL -->
  <rect x="320" y="300" width="200" height="80" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="420" y="334" font-size="18" fill="#f1f5f9" text-anchor="middle" font-weight="700">PostgreSQL</text>
  <text x="420" y="358" font-size="12" fill="#cbd5e1" text-anchor="middle">Base partagée (service « db »)</text>

  <!-- Gemini -->
  <rect x="660" y="125" width="210" height="90" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="765" y="160" font-size="17" fill="#f1f5f9" text-anchor="middle" font-weight="700">API Gemini</text>
  <text x="765" y="184" font-size="12" fill="#cbd5e1" text-anchor="middle">Lecture des captures de profil</text>
  <text x="765" y="202" font-size="12" fill="#fbbf24" text-anchor="middle">facultatif (clé requise)</text>

  <!-- PoGo-Pau -->
  <rect x="610" y="290" width="260" height="100" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="740" y="326" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="700">PoGo-Pau</text>
  <text x="740" y="348" font-size="12" fill="#cbd5e1" text-anchor="middle">dépôt séparé : site + API</text>
  <text x="740" y="368" font-size="12" fill="#94a3b8" text-anchor="middle">démarre la base et le réseau « mewnivers »</text>

  <!-- Flèches -->
  <line x1="204" y1="170" x2="316" y2="170" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="420" y1="234" x2="420" y2="296" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="524" y1="170" x2="656" y2="170" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <line x1="524" y1="340" x2="606" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="565" y="330" font-size="11" fill="#94a3b8" text-anchor="middle">même base</text>
  <text x="260" y="160" font-size="11" fill="#94a3b8" text-anchor="middle">événements</text>
</svg>
