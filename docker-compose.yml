services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # La base est démarrée par le dépôt PoGo-Pau (service "db" sur le réseau
      # "mewnivers"). Lancer cette stack-là avant le bot.
      DATABASE_URL: postgres://rotom:${POSTGRES_PASSWORD}@db:5432/rotom

# Réseau créé par le docker-compose de PoGo-Pau.
networks:
  default:
    name: mewnivers
    external: true
